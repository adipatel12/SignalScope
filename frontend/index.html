<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalScope | Enterprise AI Forensics</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00ff41;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-top: 0;
            font-family: monospace;
            margin-bottom: 30px;
        }

        .container {
            background-color: #121212;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #333;
        }

        .profile-selector {
            margin-bottom: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: #aaa;
        }

        .profile-selector select {
            width: 100%;
            padding: 8px;
            background: #1e1e1e;
            color: #00ff41;
            border: 1px solid #444;
            border-radius: 4px;
            margin-top: 5px;
            font-family: monospace;
        }

        #drop-area {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 30px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #drop-area.hover {
            border-color: #00ff41;
            background-color: rgba(0, 255, 65, 0.05);
        }

        #fileElem {
            display: none;
        }

        #preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 15px;
            border-radius: 4px;
            display: none;
            border: 1px solid #333;
        }

        button {
            background-color: #00ff41;
            color: #000;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #00cc33;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        button:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 4px;
            display: none;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid;
            text-align: left;
        }

        .real {
            background-color: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border-color: #00ff41;
        }

        .fake {
            background-color: rgba(255, 0, 60, 0.1);
            color: #ff003c;
            border-color: #ff003c;
        }

        .details {
            font-size: 13px;
            font-weight: normal;
            margin-top: 12px;
            color: #ccc;
            font-family: monospace;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <h1>SIGNALSCOPE</h1>
    <p class="subtitle">PROD_VER: DUAL-STREAM V2 (ENTERPRISE)</p>

    <div class="container">
        <!-- New Profile Selector -->
        <div class="profile-selector">
            <label for="profile">DETECTION PROFILE:</label>
            <select id="profile">
                <option value="balanced">Balanced (Standard Default)</option>
                <option value="lenient">Lenient (Smartphone HDR Optimized)</option>
                <option value="strict">Strict (Journalism & Legal Triage)</option>
            </select>
        </div>

        <div id="drop-area">
            <p>Drag & Drop image to scan<br><span style="font-size: 12px; color: #666;">or click to browse local
                    files</span></p>
            <input type="file" id="fileElem" accept="image/*">
            <img id="preview" src="" alt="Image preview">
        </div>

        <button id="analyze-btn" disabled>INITIATE ENTERPRISE SCAN</button>

        <div id="result">
            <div id="verdict"></div>
            <div class="details" id="stats"></div>
        </div>
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('fileElem');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        const resultDiv = document.getElementById('result');
        const verdictDiv = document.getElementById('verdict');
        const statsDiv = document.getElementById('stats');
        const profileSelect = document.getElementById('profile'); // Grab the dropdown
        let currentFile = null;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropArea.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
        dropArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function () { handleFiles(this.files); });

        function handleFiles(files) {
            if (files.length > 0) {
                currentFile = files[0];
                preview.src = URL.createObjectURL(currentFile);
                preview.style.display = 'block';
                analyzeBtn.disabled = false;
                resultDiv.style.display = 'none';
                dropArea.querySelector('p').style.display = 'none';
            }
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            analyzeBtn.disabled = true;
            analyzeBtn.innerText = 'PROCESSING TENSORS...';

            const formData = new FormData();
            formData.append('file', currentFile);
            // Append the selected profile to the API request
            formData.append('profile', profileSelect.value);

            try {
                const response = await fetch('http://127.0.0.1:8000/analyze/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("API Error");
                const data = await response.json();

                resultDiv.style.display = 'block';

                if (data.prediction === "Likely AI-generated") {
                    resultDiv.className = 'fake';
                    verdictDiv.innerText = "⚠️ SYNTHETIC ANOMALY DETECTED";
                } else {
                    resultDiv.className = 'real';
                    verdictDiv.innerText = "✅ AUTHENTIC MEDIA VERIFIED";
                }

                statsDiv.innerHTML = `
                    > FILE        : ${data.filename} (${data.dimensions})<br>
                    > RISK TIER   : ${data.risk_tier}<br>
                    > AI SCORE    : ${(data.confidence_ai * 100).toFixed(2)}%<br>
                    > THRESHOLD   : ${data.threshold_used} (${data.profile_applied.toUpperCase()})
                `;
            } catch (error) {
                alert('Connection error. Ensure uvicorn is running.');
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = 'INITIATE ENTERPRISE SCAN';
            }
        });
    </script>
</body>

</html>
